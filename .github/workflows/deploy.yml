name: Deploy

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore and build
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Build Docker image
        run: docker build -t dnd-game:${{ github.sha }} -f Dockerfile .

      - name: Determine target environment
        id: target
        run: |
          if [[ "${{ github.ref_name }}" == "develop" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "host=staging-server.example.com" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "host=prod-server.example.com" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH (example)
        if: steps.target.outputs.host != ''
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            docker pull dnd-game:${{ github.sha }}
            docker stop dnd-game || true
            docker rm dnd-game || true
            docker run -d --name dnd-game -p 5000:5000 --restart=unless-stopped \
              -e ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION_STRING }}" \
              -e Token__Secret="${{ secrets.TOKEN_SECRET }}" \
              dnd-game:${{ github.sha }}